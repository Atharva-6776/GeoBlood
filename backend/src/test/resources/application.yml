spring:
  datasource:
    url: jdbc:h2:mem:geoblood_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: GeoBloodLinkSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    root: INFO
    com.geoblood: WARN
